[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabcli"
version = "2.0.0"
description = "AI-powered vocabulary builder and dictionary CLI for linguaphiles"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Atharva Shah", email = "HighnessAtharva@gmail.com" },
    { name = "Anay Deshpande" },
]
keywords = [
    "cli",
    "vocabulary",
    "dictionary",
    "nlp",
    "openai",
    "typer",
    "terminal",
    "language-learning",
    "spaced-repetition",
    "flashcards",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.9",
    "requests>=2.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.11",
    "fpdf2>=2.8",
    "Pillow>=10.4",
    "pyspellchecker>=0.8",
    "questionary>=2.0",
    "regex>=2024.9",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    "numpy>=2.0",
    "textstat>=0.7.4",
    "trafilatura>=1.12",
    "textual>=0.80",
]

[project.optional-dependencies]
ai = [
    "openai>=1.50",
]
nlp = [
    "spacy>=3.8",
    "spacytextblob>=0.1.7",
    "nltk>=3.9",
    "torch>=2.4",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "mkdocs-material>=9.5",
    "mkdocs-typer>=0.0.3",
]

[project.scripts]
vocab = "vocabCLI.vocabCLI:app"

[project.urls]
Homepage = "https://vocabcli.github.io"
Documentation = "https://vocabcli.github.io/docs"
Repository = "https://github.com/HighnessAtharva/VocabCLI"
"Bug Tracker" = "https://github.com/HighnessAtharva/VocabCLI/issues"
Changelog = "https://github.com/HighnessAtharva/VocabCLI/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["vocabCLI*"]

[tool.setuptools.package-data]
"vocabCLI.modules" = [
    "*.csv",
    "*.txt",
]
"vocabCLI" = [
    "assets/*",
    "assets/logos/*",
]

# ──────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["vocabCLI"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]

# ──────────────────────────────────────────────────
# ruff  (replaces black + isort + flake8)
# ──────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not perform function calls in default arguments
    "SIM117", # merge with-statements
]

[tool.ruff.lint.isort]
known-first-party = ["vocabCLI"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ──────────────────────────────────────────────────
# mypy
# ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
