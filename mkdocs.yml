site_name: VocabCLI
site_description: AI-powered vocabulary builder and dictionary CLI for linguaphiles
site_url: https://vocabcli.github.io
repo_name: HighnessAtharva/VocabCLI
repo_url: https://github.com/HighnessAtharva/VocabCLI
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: green
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  logo: assets/logos/VocabCLI.png
  favicon: assets/logos/VocabCLI.ico

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [vocabCLI]

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - footnotes

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HighnessAtharva/VocabCLI
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vocabcli/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Features:
      - Dictionary & Thesaurus: features/dictionary.md
      - Word Management: features/word-management.md
      - Spaced Repetition: features/spaced-repetition.md
      - Flashcards: features/flashcards.md
      - Graphs & Stats: features/graphs.md
      - NLP Tools: features/nlp.md
  - AI Features:
      - Overview: ai/overview.md
      - vocab ai explain: ai/explain.md
      - vocab ai mnemonic: ai/mnemonic.md
      - vocab ai story: ai/story.md
      - vocab ai quiz: ai/quiz.md
      - vocab ai chat: ai/chat.md
      - Local AI (Ollama): ai/ollama.md
  - Commands Reference: commands.md
  - Configuration Reference: configuration.md
  - Contributing: contributing.md
  - Changelog: changelog.md
